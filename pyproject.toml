[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amanah-ml"
version = "0.1.0"
description = "Semantic integrity engine for AMANAH"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "torch>=2.3",
  "transformers>=4.45",
  "requests>=2.32",
  "huggingface_hub>=0.35",
]

[project.optional-dependencies]
train = ["datasets>=3.0", "sentence-transformers>=3.0", "evaluate>=0.4"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
